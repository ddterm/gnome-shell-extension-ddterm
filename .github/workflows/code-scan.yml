name: code-scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '22 7 * * *'

jobs:
  codeql:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
          - actions

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            threat-models: local

      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: '/language:${{matrix.language}}'

  zizmor:
    runs-on: ubuntu-slim

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - working-directory: ${{ runner.temp }}
        run: |
          wget "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZIZMOR_SHA256 zizmor-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check --strict -
          mkdir zizmor
          tar -C zizmor -xf zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "$(pwd)/zizmor" >>"$GITHUB_PATH"
        env:
          # renovate: datasource=custom.github-release-assets depName=zizmor packageName="zizmor-x86_64-unknown-linux-gnu.tar.gz" registryUrl=https://api.github.com/repos/zizmorcore/zizmor/releases
          ZIZMOR_VERSION: '1.30.0'
          # renovate-digest: datasource=custom.github-release-assets depName=zizmor currentValue=1.30.0 packageName="zizmor-x86_64-unknown-linux-gnu.tar.gz" registryUrl=https://api.github.com/repos/zizmorcore/zizmor/releases
          ZIZMOR_SHA256: 'ec8c95cd800845abb9bbc5f377ec7c57d2eb8e2386a00a201d3a74ee4092e5ed'

      - run: zizmor --format=sarif . >"$RUNNER_TEMP/results.sarif"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: ${{ runner.temp }}/results.sarif
          category: zizmor
